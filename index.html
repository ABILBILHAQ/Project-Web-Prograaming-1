    <style>
      /* Zero-overhead critical CSS for instant First Contentful Paint */
      html, body {
        background-color: #273338;
        color: #f2f5ed;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #273338;
        z-index: 9999;
      }
      .loader-pulse {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #9cb080 0%, #618764 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.5);
        animation: pulse-logo 1.5s infinite ease-in-out;
      }
      .loader-ring {
        width: 24px;
        height: 24px;
        margin-top: 18px;
        border: 2.5px solid rgba(156, 176, 128, 0.25);
        border-top-color: #9cb080;
        border-radius: 50%;
        animation: spin-ring 0.8s linear infinite;
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.85; }
      }
      @keyframes spin-ring {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body class="bg-background text-foreground antialiased">
